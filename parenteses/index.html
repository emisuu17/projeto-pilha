<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício de Pilha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Verificador de Parenteses</h2>
        <p>Digite sua expressão aqui:</p>
        
        <input type="text" id="meuInput" placeholder="ex: (a + b)">
        <br>
        <button onclick="fazerOteste()">Verificar</button>

        <h1 id="textoResultado"></h1>
    </div>

    <script>
        class Node {
            constructor(value){
                this.value = value;
                this.prev = null;
            }
        }

        class LinkedStack {
            constructor(){
                this.top = null;
            }
            
            push(value) {
                const node = new Node(value);
                if (this.isEmpty()){
                    this.top = node;
                } else {
                    node.prev = this.top;
                    this.top = node;
                }
            }

            pop(){
                if (this.isEmpty()){
                    console.log("A pilha está vazia");
                    return null;
                } else {
                    const value = this.top.value;
                    this.top = this.top.prev;
                    return value;
                }
            }

            isEmpty(){
                return this.top === null;
            }

            peek(){
                if (this.isEmpty()){
                    console.log("A pilha está vazia");
                    return null;
                }
                return this.top.value;
            }

            size(){
                let temp = this.top;
                let _size = 0;
                while (temp !== null){
                    _size += 1;
                    temp = temp.prev;
                }
                return _size;
            }
        }

        function fazerOteste() {
            let texto = document.getElementById("meuInput").value;
            let minhaPilha = new LinkedStack();
            let deuErro = false;

            for (let i = 0; i < texto.length; i++) {
                let letra = texto[i];

                if (letra === '(' || letra === '[' || letra === '{') {
                    minhaPilha.push(letra);
                }

                if (letra === ')') {
                    let ultimo = minhaPilha.pop();
                    if (ultimo !== '(') {
                        deuErro = true;
                    }
                }
                
                if (letra === ']') {
                    let ultimo = minhaPilha.pop();
                    if (ultimo !== '[') {
                        deuErro = true;
                    }
                }

                if (letra === '}') {
                    let ultimo = minhaPilha.pop();
                    if (ultimo !== '{') {
                        deuErro = true;
                    }
                }
            }

            if (minhaPilha.isEmpty() === false) {
                deuErro = true;
            }

            let resultado = document.getElementById("textoResultado");
            
            if (deuErro === true) {
                resultado.innerHTML = "Inválido!";
                resultado.style.color = "red";
            } else {
                resultado.innerHTML = "Válido!";
                resultado.style.color = "green";
            }
        }
    </script>
</body>
</html>
